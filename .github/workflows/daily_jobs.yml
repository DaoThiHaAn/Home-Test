name: OptiBot Daily Sync Job

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t optibot-scraper .

      - name: Run Scraper Container
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FILE_SEARCH_STORE_NAME: ${{ secrets.GEMINI_FILE_SEARCH_STORE_NAME }}
        run: |
          docker run \
            -e GEMINI_API_KEY="$GEMINI_API_KEY" \
            -e GEMINI_FILE_SEARCH_STORE_NAME="$GEMINI_FILE_SEARCH_STORE_NAME" \
            optibot-scraper

      - name: Upload Last Run Artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-report
          path: last_run.txt
